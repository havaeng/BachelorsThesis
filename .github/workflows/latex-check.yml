name: LaTeX Syntax Check

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.bib'
      - '.github/workflows/latex-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.bib'
      - '.github/workflows/latex-check.yml'

jobs:
  latex-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            collection-basic
            bibtex
            babel
            hyph-utf8
            lipsum
            nomencl

      - name: Locate TeX Live binaries
        id: texlive-bin
        run: |
          set -euo pipefail
          TEXBIN="$(find /home/runner -type f -name pdflatex -perm -111 2>/dev/null | head -1)"
          if [ -z "$TEXBIN" ]; then
            echo "pdflatex not found" >&2
            exit 1
          fi
          echo "bin_dir=$(dirname "$TEXBIN")" >> "$GITHUB_OUTPUT"

      - name: Check LaTeX syntax
        run: |
          "${{ steps.texlive-bin.outputs.bin_dir }}/pdflatex" -interaction=nonstopmode -draftmode main.tex
        working-directory: src

      - name: Compile with bibliography
        run: |
          TEXBIN="${{ steps.texlive-bin.outputs.bin_dir }}"
          "$TEXBIN/pdflatex" -interaction=nonstopmode -draftmode main.tex
          "$TEXBIN/bibtex" main || true
          "$TEXBIN/pdflatex" -interaction=nonstopmode -draftmode main.tex
          "$TEXBIN/pdflatex" -interaction=nonstopmode -draftmode main.tex
        working-directory: src

      - name: Check for compilation warnings
        run: |
          if [ -f main.log ]; then
            echo "=== LaTeX Compilation Log Summary ==="
            grep -E "^(Underfull|Overfull|Package|LaTeX Warning)" main.log || echo "No warnings found"
          fi
        working-directory: src

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: latex-logs
          path: src/*.log
          retention-days: 7
